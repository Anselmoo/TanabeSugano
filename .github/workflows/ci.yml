name: CI/CD Pipeline

on:
  push:
    branches: [master, develop]
    tags: ["v*"]
  pull_request:
    branches: [master, develop]
  release:
    types: [published]
  workflow_dispatch:

# Cancel superseded runs on PR / non-master pushes. Tag and master runs are
# allowed to complete (publishes must not be cancelled mid-flight).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ============================================================================
  # 1. Lint & Policy Checks
  # ============================================================================
  lint:
    name: Lint & Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv sync --all-groups --extra mcp
      - name: Run Ruff checks
        run: uv run ruff check src/ scripts/
      - name: Run Ruff format check
        run: uv run ruff format --check src/ scripts/
      - name: Validate release policy (rrt)
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/')
        uses: Anselmoo/repo-release-tools@v1
        with:
          check-branch-name: "true"
          check-commit-subject: "true"
          check-changelog: "true"
          changelog-strategy: "incremental"

  # ============================================================================
  # 2. Tests
  # ============================================================================
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --all-groups --extra mcp
      - name: Run pytest
        run: uv run pytest -vv --cov=src/tanabesugano --cov-report=xml --cov-report=term-missing
      - name: Upload coverage (3.12 only)
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  # ============================================================================
  # 3. Artifacts (Build, MCPB, SBOM, Attestation)
  # ============================================================================
  artifacts:
    name: Build & Package Artifacts
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request' || startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build distributions
        run: uv build

      - name: Build .mcpb bundle
        run: python scripts/build_mcpb.py

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: dist/sbom.spdx.json
          artifact-name: sbom.spdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: Upload all artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-payload
          path: dist/
          if-no-files-found: error

  # ============================================================================
  # 4. Docker CD
  # ============================================================================
  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: lint
    if: hashFiles('Dockerfile') != ''
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Smoke Test
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Smoke test
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          docker run --rm ${{ fromJSON(steps.meta.outputs.json).tags[0] }} tanabesugano --help

  # ============================================================================
  # 5. Documentation (GitHub Pages)
  # ============================================================================
  pages:
    name: Deploy Docs Site
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: docs/package-lock.json
      - run: cd docs && npm ci && npm run build
      - name: Copy diagram CSVs into build output
        run: |
          mkdir -p docs/dist/ts-diagrams
          cp -r docs/ts-diagrams/* docs/dist/ts-diagrams/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/dist
      - id: deployment
        uses: actions/deploy-pages@v4

  # ============================================================================
  # 6. Publish & Release
  # ============================================================================
  publish:
    name: Publish & Release
    runs-on: ubuntu-latest
    needs: [artifacts, docker]
    if: startsWith(github.ref, 'refs/heads/master') || startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write
      contents: write
    environment:
      name: pypi
      url: https://pypi.org/project/tanabesugano/
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-payload
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          print-hash: true

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/')
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create/Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              --repo "${{ github.repository }}" \
              --clobber \
              dist/*
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${{ github.repository }}" \
              --title "Release ${GITHUB_REF_NAME}" \
              --generate-notes \
              dist/*
          fi
