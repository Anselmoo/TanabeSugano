name: CI/CD Pipeline

on:
  push:
    branches: [master, develop]
    tags: ["v*"]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

# Cancel superseded runs on PR / non-master pushes. Tag and master runs are
# allowed to complete (publishes must not be cancelled mid-flight).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ============================================================================
  # 1. Lint & Policy Checks
  # ============================================================================
  lint:
    name: Lint & Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-groups --extra mcp

      - name: Run pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Validate release policy (rrt)
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/')
        uses: Anselmoo/repo-release-tools@v1.8.1
        with:
          check-branch-name: "true"
          check-commit-subject: "true"
          check-changelog: "true"
          changelog-strategy: "incremental"

  # ============================================================================
  # 2. Tests
  # ============================================================================
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups --extra mcp

      - name: Run pytest
        run: uv run pytest -vv --cov=src/tanabesugano --cov-report=xml --cov-report=term-missing

      - name: Upload coverage (3.12 only)
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
