name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

# Cancel superseded runs on PR only. Tag and branch pushes are allowed to
# complete (publishes must not be cancelled mid-flight).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ──────────────────────────── 0. Verification ─────────────────────────────
  verify:
    name: ✅ Snapshot drift checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # SHA-pinned with a version comment, which is how setup-uv documents its own
      # usage: the project stopped publishing floating major tags after v7, so
      # @v10 is not a resolvable ref. Dependabot's github-actions ecosystem bumps
      # the SHA and the comment together.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv sync --all-groups --extra mcp
      - name: Check health regressions
        run: uv run rrt doctor --check --strict
      - name: Generate tree manifest (for diagnostics)
        run: uv run rrt tree --manifest --compress
      - name: Upload tree manifest artifact
        uses: actions/upload-artifact@v7
        with:
          name: tree-manifest
          path: .rrt/tree.manifest.json.gz
          retention-days: 7
      - name: Check tree structure drift
        run: uv run rrt tree --check --strict --strict-empty-dirs
      - name: Check artifact integrity
        run: uv run rrt artifacts --check --strict

  # ──────────────────────────── 1. Static checks ────────────────────────────
  lint:
    name: Lint & Policy
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-groups --extra mcp

      - name: Run pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Validate release policy (rrt)
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/')
        uses: Anselmoo/repo-release-tools@v1.15.0
        with:
          check-branch-name: "true"
          check-commit-subject: "true"
          check-changelog: "true"
          changelog-strategy: "auto"

  # ─────────────────────────────── 2. Tests ─────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups --extra mcp

      - name: Run pytest
        run: uv run pytest -vv --cov=src/tanabesugano --cov-report=xml --cov-report=term-missing -m "not screenshot"

      - name: Upload coverage (3.12 only)
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  # ──────────────────────── 3. Screenshot tests ─────────────────────────────
  screenshots:
    name: Screenshot tests (Playwright)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv sync --all-groups --extra mcp
      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium
      - name: Run screenshot tests
        run: uv run pytest -vv -m screenshot --browser chromium

  # ───────────────────────── 4. Build wheel + sdist ─────────────────────────
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  # ────────────────────────── 5. .mcpb bundle ───────────────────────────────
  mcpb:
    name: Build .mcpb bundle
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Download wheel
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      # Emits the PEP 440-normalised version (the form on PyPI, and the only
      # form a bundle may pin) and fails if a tag disagrees with the artifact.
      - name: Resolve bundle version
        id: ver
        run: uv run --no-project --with packaging python scripts/release_version.py --dist dist
      # The mcp2mcpb CLI is invoked directly rather than via Anselmoo/mcp2mcpb:
      # the composite action treats --from-dist and --pin as mutually exclusive,
      # and a release bundle needs both (build offline from the local wheel, but
      # emit a version-pinned runtime reference).
      - name: Build .mcpb bundle
        run: |
          uvx mcp2mcpb==1.0.0 convert tanabesugano \
            --registry pypi \
            --mode reference \
            --extra mcp \
            --entry-script tanabesugano-mcp \
            --from-dist dist/ \
            --pin "${{ steps.ver.outputs.version }}" \
            --output dist/ \
            --verbose
      - name: Validate bundle launch recipe
        run: python scripts/validate_mcpb.py dist "${{ steps.ver.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: mcpb-package
          path: dist/*.mcpb
          if-no-files-found: error

  # ─────────────────────────── 5. Docker sanity ─────────────────────────────
  docker:
    name: Docker image build (sanity)
    runs-on: ubuntu-latest
    needs: lint
    # if: hashFiles('Dockerfile') != ''
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: tanabesugano:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────── 6. SBOM (Syft → SPDX) ───────────────────────────
  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Generate SPDX SBOM for the source tree
        uses: anchore/sbom-action@v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: sbom-source.spdx.json
          artifact-name: sbom-source.spdx.json
      - name: Resolve wheel path
        id: wheel
        run: echo "path=$(ls dist/*.whl | head -1)" >> "$GITHUB_OUTPUT"
      - name: Generate SPDX SBOM for the built wheel
        uses: anchore/sbom-action@v0.24.0
        with:
          file: ${{ steps.wheel.outputs.path }}
          format: spdx-json
          output-file: sbom-wheel.spdx.json
          artifact-name: sbom-wheel.spdx.json

  # ────────────────────── 7. Dependency review (PR only) ────────────────────
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5

  # ───────────────────── 8. Build & deploy GitHub Pages ─────────────────────
  pages-build:
    name: Build docs site
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: docs/package-lock.json
      - run: cd docs && npm ci && npm run build
      - name: Copy diagram CSVs into build output
        run: |
          mkdir -p docs/dist/ts-diagrams
          cp -r docs/ts-diagrams/* docs/dist/ts-diagrams/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs/dist

  pages-deploy:
    name: Deploy docs site
    runs-on: ubuntu-latest
    needs: pages-build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    # Job-level concurrency overrides workflow-level so Pages deploys serialize cleanly.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # ───────────────────────── 9. Publish to TestPyPI ─────────────────────────
  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: [build, sbom]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    environment:
      name: testpypi
      url: https://test.pypi.org/project/tanabesugano/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          print-hash: true

  # ─────────────────────────── 10. Publish to PyPI ──────────────────────────
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build, sbom, mcpb]
    if: startsWith(github.ref, 'refs/tags/')
    environment:
      name: pypi
      url: https://pypi.org/project/tanabesugano/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      # skip-existing keeps a re-run of a partially-failed tag pipeline viable;
      # without it PyPI 400s on the already-uploaded file and the release job
      # can never be reached.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          print-hash: true

  # ─────────────────── 11. Create Release (body + all assets) ───────────────
  #
  # release and release-assets used to be two jobs, which allowed the state
  # that broke v1.7.x: a Release object created with zero assets, or a
  # successful PyPI publish with no Release at all. They are now one job, so
  # the body and every artifact are published in a single atomic operation.
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, mcpb, sbom, publish-pypi]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv sync --all-groups --extra mcp

      # Never pattern-match the tag: `rrt bump alpha` writes SemVer-style
      # pre-releases (v1.8.0-alpha.1) whose PEP 440 normalisation is 1.8.0a1, and
      # a regex on the raw string reads that as a stable release.
      - name: Resolve release metadata
        id: rel
        run: uv run --no-project --with packaging python scripts/release_version.py --ref-name "$GITHUB_REF_NAME"

      # The fallback chain lives in scripts/release_notes.py so each branch is
      # testable outside CI. Summary: this project uses
      # `changelog_workflow = "incremental"`, so the bump PR moves [Unreleased]
      # into a versioned heading; a bare `rrt release notes` therefore reads an
      # always-empty [Unreleased] and exits 1 — the exact failure that killed
      # v1.7.0, v1.7.1 and v1.7.2.
      - name: Generate changelog body
        run: |
          uv run python scripts/release_notes.py \
            --version "${{ steps.rel.outputs.version }}" \
            --raw-version "${{ steps.rel.outputs.raw_version }}" \
            --output RELEASE_CHANGELOG.md
      - name: Show release body
        run: cat RELEASE_CHANGELOG.md

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Download .mcpb bundle
        uses: actions/download-artifact@v8
        with:
          name: mcpb-package
          path: dist/
      - name: Download wheel SBOM
        uses: actions/download-artifact@v8
        with:
          name: sbom-wheel.spdx.json
          path: dist/
      - name: Download source SBOM
        uses: actions/download-artifact@v8
        with:
          name: sbom-source.spdx.json
          path: dist/
      - name: List release assets
        run: ls -la dist/

      - name: Create Release with assets
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_CHANGELOG.md
          draft: false
          prerelease: ${{ steps.rel.outputs.prerelease }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.mcpb
            dist/sbom-*.spdx.json
          # A release missing its .mcpb is a defect, not a detail: the README
          # advertises the bundle as the one-click Claude Desktop install path.
          fail_on_unmatched_files: true

  # ──────────────── 12. Post-release .mcpb install smoke test ───────────────
  #
  # Runs after the Release exists, so a broken bundle reports loudly without
  # blocking a release whose artifacts are already published. This is the check
  # that would have caught the v1.7.x bundle launching the CLI instead of the
  # MCP server.
  mcpb-smoke:
    name: .mcpb install smoke test
    runs-on: ubuntu-latest
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: mcpb-package
          path: dist/
      - name: Launch the bundle under stdio and verify the MCP handshake
        run: |
          set -euo pipefail
          BUNDLE="$(ls dist/*.mcpb | head -1)"
          echo "Sandboxing $BUNDLE"
          uvx mcp2mcpb==1.0.0 sandbox "$BUNDLE" --timeout 180
