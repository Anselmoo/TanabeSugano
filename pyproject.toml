[project]
name = "tanabesugano"
version = "1.6.1"
description = "A python-solver for Tanabe-Sugano and Energy-Correlation diagrams"
authors = [{ name = "Anselm Hahn", email = "anselm.hahn@gmail.com" }]
maintainers = [{ name = "Anselm Hahn", email = "anselm.hahn@gmail.com" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "terminal",
    "data-visualization",
    "tanabe-sugano",
    "energy-correlation",
    "complex-ions",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Unix",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Shells",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Utilities",
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=1.2.4,<4.0.0",
    "numpy>=2.0.2",
    "matplotlib>=3.4.2",
    "prettytable>=2.1,<4.0",
    "update>=0.0.1,<1.0.0",
]

[project.optional-dependencies]
plotly = ["plotly>=5.13.1,<7.0.0"]
mcp = ["fastmcp[apps]>=3.3.0"]

[project.scripts]
tanabesugano = "tanabesugano.cmd:cmd_line"
tanabesugano-mcp = "tanabesugano.mcp.server:main"

[project.urls]
Homepage = "https://pypi.org/project/TanabeSugano"
Repository = "https://github.com/Anselmoo/TanabeSugano"

[build-system]
requires = ["uv_build>=0.9.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

[dependency-groups]
dev = [
    "pytest>=7.2,<9.0",
    "pytest-clarity>=1.0.1",
    "pytest-cov>=4,<6",
    "pytest-console-scripts>=1.3.1",
    "repo-release-tools>=1.8.1,<2.0.0",
    "ruff>=0.7.0",
    "pre-commit>=4.6.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "N801",    # Class name should use CapWords convention (d2, d3, etc. are scientific notation)
    "N802",    # Function name should be lowercase (A_1_1_states, etc. are scientific notation)
    "N803",    # Argument name should be lowercase (Dq, B, C are standard scientific notation)
    "N806",    # Variable in function should be lowercase (Dq, B, C are standard scientific notation)
    "N815",    # mixedCase variable in class scope (Dq, B, C are scientific notation in models)
    "N816",    # mixedCase variable in global scope (Dq, B, C are scientific notation)
    "PLR0913", # Too many arguments in function definition (CLI design choice)
    "FBT001",  # Boolean-typed positional argument in function (intentional design)
    "FBT002",  # Boolean default positional argument in function (intentional design)
    "A005",    # Module shadows Python standard library (cmd.py is intentional)
]

[tool.ruff.lint.per-file-ignores]
"src/tanabesugano/test/*" = [
    "PT006", "ANN001", "ANN201", "D103", "S101", "PLR2004", "PLC0415",
]
"src/tanabesugano/mcp/*" = [
    "PLC0415", # lazy / soft imports are intentional for optional [mcp] extra
    "C901",    # register_tools dispatches the whole ts_* tool family
    "RUF001",  # nice typography (–, ⁻¹) in user-facing strings is intentional
    "RUF002",  # ditto in docstrings shown to humans
    "RUF003",  # ditto in inline comments
    "TC001",   # D_COUNT_LITERAL needs to be evaluated at runtime for Pydantic
    "B905",    # zip(..., strict=True) would break streaming rows in payload builders
    "F841",    # some local assignments are kept for readability in grid-search loops
    "E501",    # long lines in HTML string constants and JSON payloads are intentional
    "D401",    # imperative mood not always natural for internal helper docstrings
    "D417",    # partial arg-doc OK in internal helpers; full docs in compute_tools
    "S112",    # try-except-continue is the correct pattern for solver grid searches
    "BLE001",  # bare except is intentional: catches numpy LinAlgError in grid loops
    "RUF059",  # discarded sweep title in overlay/ratio tools is deliberate
    "PLR0915", # grid-search functions are inherently statement-heavy
    "PLR2004", # scientific threshold constants (1e-3, 2.0) are more readable inline
]
"scripts/*" = ["INP001", "T201"]

[tool.ruff.lint.isort]
known-first-party = ["tanabesugano"]
force-single-line = true
lines-between-types = 1
lines-after-imports = 2
required-imports = ["from __future__ import annotations"]

[tool.rrt]
release_branch = "release/v{version}"
changelog_file = "CHANGELOG.md"
changelog_workflow = "incremental"

[tool.rrt.checks.pre_commit]
status = "warning"
message = ".pre-commit-config.yaml exists but no repo-release-tools hooks were detected"
updated_at = "2026-06-05T14:02:23+00:00"

[[tool.rrt.version_targets]]
path = "pyproject.toml"
kind = "pep621"

[[tool.rrt.version_targets]]
path = "src/tanabesugano/__init__.py"
kind = "python_version"

[tool.pytest.ini_options]
markers = """
    xfail: mark test as expecting to fail
    skip: mark test as skipped
    mcp: tests requiring the [mcp] optional extra (fastmcp)
"""
addopts = "-v --cov=src/tanabesugano"
